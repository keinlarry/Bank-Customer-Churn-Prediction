name: CI - Test & Deploy

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer pytest
        run: pip install pytest httpx

      - name: Vérifier l'import de l'API
        run: python -c "import source.main; print('API OK')"

      - name: Vérifier le feature engineering
        run: python -c "import source.feature_engineering; print('Feature engineering OK')"

      - name: Lancer les tests pytest
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Déployer sur Render
        run: echo "Deploy step — à configurer à l'étape suivante"